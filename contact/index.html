<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar sesión · HEI01</title>
  <link rel="icon" href="../assets/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff !important;
      color: #15131a;
      font-family: Inter, "Plus Jakarta Sans", system-ui, sans-serif;
    }
    header {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }
    header a {
      color: #15131a;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 20px 40px;
      background: #ffffff;
    }
    h1 {
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      margin: 0 0 6px;
    }
    .lead {
      margin: 0 0 18px;
      color: #6e6b65;
      line-height: 1.5;
      font-size: 15px;
    }
    .embed {
      background: #ffffff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: min(80vh, 780px);
      min-height: 680px;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header><a href="../">← Volver a HEI01</a></header>
  <main>
    <h1>Agendar sesión</h1>
    <p class="lead">Elige un horario para conocernos.</p>
    <div class="embed">
      <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1PQZrGvaF53wBSMlrRLVGigUUl3GasROhOxy6AEsgrtlvdHRfxye6OBRsKI6WdBp5pTV-G0AL4?gv=true" title="Agendar sesión HEI01" loading="eager"></iframe>

</html>
